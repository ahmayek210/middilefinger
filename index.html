<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patlama!</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:white;overflow:hidden;font-family:Arial,sans-serif;user-select:none;touch-action:manipulation}.center{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}#main{font-size:clamp(130px,30vw,320px);cursor:pointer;pointer-events:auto;filter:drop-shadow(0 0 35px #a85d32);transition:transform .07s}#main:active{transform:scale(.84)}.particle{position:fixed;pointer-events:none;will-change:transform,opacity;animation:burst var(--duration) cubic-bezier(.12,.6,.25,1) forwards;font-size:var(--size);z-index:5}@keyframes burst{0%{transform:translate(-50%,-50%) scale(.35) rotate(0deg);opacity:1}75%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--scale)) rotate(var(--rot));opacity:0}}#counter{position:fixed;top:20px;left:20px;font-size:20px;font-weight:bold}#tip{position:fixed;bottom:22px;width:100%;text-align:center;color:#aaa;font-size:15px;pointer-events:none}#flash{position:fixed;inset:0;background:#ff9b4a;opacity:0;pointer-events:none;z-index:2}.shake{animation:shake .17s linear}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(7px,-5px)}50%{transform:translate(-8px,6px)}75%{transform:translate(5px,3px)}}</style></head><body><div id="flash"></div><div id="counter">Tıklama: 0</div><div class="center"><div id="main" role="button" tabindex="0" aria-label="Patlat">🖕🏿</div></div><div id="tip">Ne kadar hızlı tıklarsan o kadar büyük patlar!</div><script>const main=document.getElementById('main'),counter=document.getElementById('counter'),flash=document.getElementById('flash');let clicks=0,last=0,combo=0;const emojis=['🖕🏿','🖕🏿','🖕🏿','🖕🏾','🖕🏾','🖕🏽'];function explode(x,y){let now=performance.now();combo=now-last<420?Math.min(combo+1,25):1;last=now;clicks++;counter.textContent='Tıklama: '+clicks+' | Kombo: x'+combo;let amount=Math.min(24+combo*9,220);for(let i=0;i<amount;i++){let e=document.createElement('span');e.className='particle';e.textContent=emojis[Math.random()*emojis.length|0];let angle=Math.random()*Math.PI*2,dist=(110+Math.random()*430)*(1+combo*.065);e.style.left=x+'px';e.style.top=y+'px';e.style.setProperty('--dx',Math.cos(angle)*dist+'px');e.style.setProperty('--dy',Math.sin(angle)*dist+'px');e.style.setProperty('--rot',(Math.random()*1100-550)+'deg');e.style.setProperty('--size',(28+Math.random()*90)+'px');e.style.setProperty('--scale',(.6+Math.random()*1.7));e.style.setProperty('--duration',(650+Math.random()*850)+'ms');document.body.appendChild(e);e.addEventListener('animationend',()=>e.remove(),{once:true})}flash.style.opacity=Math.min(.1+combo*.02,.48);setTimeout(()=>flash.style.opacity=0,65);document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');}main.addEventListener('pointerdown',e=>{e.preventDefault();explode(e.clientX,e.clientY)});main.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();let r=main.getBoundingClientRect();explode(r.left+r.width/2,r.top+r.height/2)}});</script></body></html>
