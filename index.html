<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#08060f" />
  <title>🖕🏿💥</title>
  <style>
    :root { color-scheme: dark; --hot: #ff713e; --pink: #ff2aa7; --sx: 0px; --sy: 0px; --kick: 0; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: #fff; background: #07060c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none;
      cursor: crosshair;
    }
    body::before { content: ""; position: fixed; inset: -25%; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at 49% 45%, #3e174b 0%, #1d0d2d 20%, #090712 49%, #05050a 72%);
      filter: saturate(1.35); }
    body::after { content: ""; position: fixed; inset: 0; z-index: 10; pointer-events: none; opacity: .20;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,.34) 4px);
      mix-blend-mode: multiply; }
    #grid { position: fixed; inset: -100%; z-index: 0; pointer-events: none; opacity: .21;
      background-image: linear-gradient(#b580f020 1px, transparent 1px), linear-gradient(90deg, #b580f020 1px, transparent 1px);
      background-size: 54px 54px; transform: perspective(420px) rotateX(62deg) scale(1.5);
      animation: gridmove 17s linear infinite; }
    @keyframes gridmove { to { background-position: 0 108px, 108px 0; } }
    #world { position: fixed; inset: 0; z-index: 1; overflow: hidden;
      transform: translate3d(var(--sx), var(--sy), 0); touch-action: none; }
    #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #glow { position: absolute; left: 50%; top: 50%; width: min(95vw, 660px); aspect-ratio: 1;
      border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none;
      background: radial-gradient(circle, #f665353c 0%, #df35ad2b 24%, #863ceb14 46%, transparent 67%);
      filter: blur(15px); animation: glowbreath 3.7s ease-in-out infinite alternate; }
    @keyframes glowbreath { from { scale: .87; opacity: .63; } to { scale: 1.16; opacity: 1; } }
    #arena { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    #hand-zone { width: min(85vw, 440px); aspect-ratio: 1; display: grid; place-items: center; position: relative;
      filter: drop-shadow(0 0 28px #fa575a47); }
    .orbit { position: absolute; border-radius: 50%; inset: 4%; pointer-events: none;
      border: 1px solid #ff8baf3d; box-shadow: inset 0 0 38px #b2347e12, 0 0 40px #ee50a31a; }
    .orbit.o1 { inset: 4%; border-style: dashed; animation: orbit 19s linear infinite; }
    .orbit.o2 { inset: 15%; border-color: #ff9d4b52; border-width: 2px; border-top-color: transparent;
      border-bottom-color: transparent; animation: orbit 8s linear infinite reverse; }
    .orbit.o3 { inset: -8%; border-color: #9f4af721; border-left-color: transparent; animation: orbit 26s linear infinite; }
    @keyframes orbit { to { rotate: 360deg; } }
    #hand { position: relative; z-index: 2; display: block; font-size: clamp(150px, 30vw, 310px);
      line-height: 1.15; transform-origin: 50% 55%; will-change: transform, filter;
      transform: translateY(calc(7px - var(--kick) * 11px)) rotate(var(--turn, 0deg)) scale(calc(1 + var(--kick) * .24));
      filter: drop-shadow(0 12px 1px #0006) drop-shadow(0 0 35px #f88c4f63);
      animation: hover 2.4s ease-in-out infinite alternate; }
    @keyframes hover { from { translate: 0 8px; } to { translate: 0 -9px; } }
    #hand-zone.burning .orbit { border-color: #ff5d5f88; box-shadow: 0 0 38px #ff584d32; }
    #hand-zone.apocalypse .orbit { border-color: #fb38c9ab; box-shadow: 0 0 52px #ff38b677; }
    #flash { position: fixed; inset: 0; z-index: 3; background: #ff8e51; pointer-events: none;
      opacity: 0; mix-blend-mode: screen; }
    #glitch { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
      background: repeating-linear-gradient(to bottom, transparent 0 22px, #f907b31c 23px 27px, transparent 28px 60px);
      mix-blend-mode: screen; }
    #hud { position: fixed; top: max(17px, env(safe-area-inset-top)); left: 17px; right: 17px;
      z-index: 20; display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; }
    #scorebox { display: flex; align-items: center; gap: 11px; min-width: 108px; border: 1px solid #ffffff1c;
      background: #0e0b18c4; box-shadow: 0 8px 35px #0007, inset 0 0 22px #fff1; backdrop-filter: blur(14px);
      border-radius: 21px; padding: 11px 17px; }
    #scorebox .symbol { font-size: 19px; filter: drop-shadow(0 0 8px #ff793e); }
    #score { font-size: 23px; font-weight: 900; letter-spacing: -.7px; font-variant-numeric: tabular-nums; }
    .controls { display: flex; gap: 9px; pointer-events: auto; }
    .control { width: 45px; height: 45px; display: grid; place-items: center; cursor: pointer; border: 1px solid #fff2;
      border-radius: 16px; background: #110e1bc9; color: #e8ddf5; backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px #0005; transition: background .14s, transform .14s; touch-action: manipulation; }
    .control:hover { background: #34213b; } .control:active { transform: scale(.9); }
    .control svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none;
      stroke-linecap: round; stroke-linejoin: round; }
    .control:focus-visible { outline: 2px solid #ff78af; outline-offset: 4px; }
    #gauge { position: fixed; z-index: 12; bottom: max(27px, env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%); display: flex; align-items: center; gap: 13px;
      padding: 11px 17px; border-radius: 24px; background: #100c19ac; border: 1px solid #fff2;
      box-shadow: 0 8px 50px #0008; backdrop-filter: blur(12px); pointer-events: none; }
    #mood { font-size: 27px; width: 30px; text-align: center; filter: drop-shadow(0 0 10px #ff724a68);
      transition: transform .12s; }
    #pips { display: flex; gap: 5px; align-items: flex-end; height: 25px; }
    .pip { width: 7px; height: 10px; border-radius: 5px; background: #373044; box-shadow: inset 0 1px 3px #0007;
      transition: height .16s, background .12s, box-shadow .12s; }
    .pip.active { height: 24px; background: linear-gradient(to top, #ff5f39, #ffd171);
      box-shadow: 0 0 10px #ff713e9c, 0 0 3px #ffc261; }
    .pip.critical { background: linear-gradient(to top, #e832ba, #ffcaff); box-shadow: 0 0 14px #f725b6; }
    #halo { position: fixed; pointer-events: none; z-index: 2; left: 50%; top: 50%; width: 200px; height: 200px;
      border-radius: 50%; border: 8px solid #ffb24b; opacity: 0; transform: translate(-50%, -50%) scale(.5);
      box-shadow: 0 0 45px #ff5579; }
    #burstIcon { position: fixed; z-index: 6; pointer-events: none; left: 50%; top: 46%; transform: translate(-50%, -50%) scale(.2);
      font-size: clamp(100px, 24vw, 250px); opacity: 0; filter: drop-shadow(0 0 35px #ff713e); }
    .pop { animation: supersymbol .55s cubic-bezier(.15,.8,.3,1) both; }
    @keyframes supersymbol { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.15) rotate(-35deg); }
      29% { opacity: 1; transform: translate(-50%, -50%) scale(1.45) rotate(10deg); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(2.25) rotate(34deg); } }
    #tinyhelp { position: fixed; bottom: 12px; width: 100%; text-align: center; color: #84738a; font-size: 10px;
      z-index: 7; letter-spacing: .12em; pointer-events: none; }
    @media (max-width: 520px) { #hand-zone { width: min(96vw, 380px); } #hand { font-size: clamp(160px, 43vw, 260px); }
      #gauge { bottom: max(22px, env(safe-area-inset-bottom)); } .pip { width: 6px; } #score { font-size: 21px; }
      #scorebox { padding: 10px 14px; } #tinyhelp { display: none; } }
    @media (prefers-reduced-motion: reduce) { #grid, #glow, .orbit, #hand { animation: none; } }
  </style>
</head>
<body>
  <div id="grid" aria-hidden="true"></div>
  <div id="world" role="button" tabindex="0" aria-label="Ekrana dokunarak patlat">
    <div id="glow"></div>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="arena"><div id="hand-zone" aria-hidden="true">
      <div class="orbit o3"></div><div class="orbit o1"></div><div class="orbit o2"></div>
      <span id="hand">🖕🏿</span>
    </div></div>
  </div>
  <div id="flash"></div><div id="glitch"></div><div id="halo"></div><div id="burstIcon"></div>
  <div id="hud">
    <div id="scorebox" aria-label="Toplam tıklama"><span class="symbol" aria-hidden="true">💥</span><span id="score">0</span></div>
    <div class="controls">
      <button class="control" id="sound" type="button" aria-label="Sesi aç" title="Ses aç/kapat">
        <svg viewBox="0 0 24 24" id="speakerOff"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m17 9 5 6m0-6-5 6"/></svg>
        <svg viewBox="0 0 24 24" id="speakerOn" style="display:none"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
      </button>
      <button class="control" id="reset" type="button" aria-label="Skoru sıfırla" title="Sıfırla">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
  </div>
  <div id="gauge" aria-label="Görsel kombo göstergesi"><span id="mood" aria-hidden="true">💥</span><div id="pips" aria-hidden="true"></div></div>
  <script>
  (() => {
    'use strict';
    const canvas = document.getElementById('fx'), ctx = canvas.getContext('2d', {alpha:true});
    const world = document.getElementById('world'), zone = document.getElementById('hand-zone');
    const hand = document.getElementById('hand'), flash = document.getElementById('flash');
    const scoreText = document.getElementById('score'), mood = document.getElementById('mood');
    const pips = document.getElementById('pips'), glitch = document.getElementById('glitch');
    const burstIcon = document.getElementById('burstIcon'), halo = document.getElementById('halo');
    const btnSound = document.getElementById('sound'), btnReset = document.getElementById('reset');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const rand = (a,b) => a+Math.random()*(b-a);
    const choose = list => list[Math.floor(Math.random()*list.length)];
    const colors = ['#ff7438','#ffc44a','#fa35a6','#cb65ff','#fbfeff','#6cfdf0','#ff334e'];
    const fingers = ['🖕🏿','🖕🏿','🖕🏿','🖕🏿','🖕🏾','🖕🏾','🖕🏽'];
    const chaos = ['💀','🤡','🔥','💥','🧨','⚡','🤯','👹','🗿','🌋'];
    const sprites = new Map();
    for (const emoji of [...new Set([...fingers, ...chaos, '👑', '☄️'])]) {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const p = c.getContext('2d');
      p.font = '98px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      p.textAlign = 'center'; p.textBaseline = 'middle'; p.fillText(emoji,64,68);
      sprites.set(emoji,c);
    }
    let w=innerWidth,h=innerHeight,dpr=1, lastFrame=performance.now(),lastClick=0;
    let clicks = 0, combo = 0, heat=0, shake=0, kick=0, twist=0, flashStrength=0, glitchStrength=0;
    let particles=[],rings=[],stars=[], audio=null, audioEnabled=false, lastSound=0;
    const pipEls=[];
    for(let i=0;i<12;i++) { const el=document.createElement('span'); el.className='pip'; pips.appendChild(el); pipEls.push(el); }
    try { clicks = Number(localStorage.getItem('parmak-kaos-score')||0)||0; } catch(_) {}
    scoreText.textContent=clicks.toLocaleString('tr-TR');
    function resize() {
      w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
      canvas.width=Math.ceil(w*dpr);canvas.height=Math.ceil(h*dpr);
      canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
      stars=Array.from({length:Math.min(135,Math.floor(w*h/7300))},()=>({x:rand(0,w),y:rand(0,h),r:rand(.4,2),a:rand(.09,.45),v:rand(2,14),phase:rand(0,Math.PI*2)}));
    }
    addEventListener('resize',resize,{passive:true});resize();
    function setPips(n) {
      const count=Math.min(12,Math.ceil(n/4));
      pipEls.forEach((p,i)=>{p.classList.toggle('active',i<count);p.classList.toggle('critical',i<count && n>=38);});
      const icon=n>=65?'👑':n>=38?'💀':n>=22?'🌋':n>=10?'🔥':'💥';
      if(mood.textContent!==icon){mood.textContent=icon;mood.style.transform='scale(1.4) rotate(-13deg)';setTimeout(()=>mood.style.transform='',120);}
      zone.classList.toggle('burning',n>=12); zone.classList.toggle('apocalypse',n>=38);
    }
    function emit(x,y,superMode=false) {
      const n=Math.min(130, 27+Math.floor(combo*2.1)+(superMode?45:0));
      const isTiny=w<600; const spread= Math.min(w,h)*(.35+Math.min(combo,45)*.006);
      for(let i=0;i<n;i++) {
        const a=Math.random()*Math.PI*2;
        const v=rand(115,390)+combo*rand(1.9,5.8)+(superMode?150:0);
        const r=Math.random();let kind=r<.18?'emoji':r<.55?'spark':r<.81?'shard':'dust';
        const e=kind==='emoji'?(combo>=10 && Math.random()<.24?choose(chaos):choose(fingers)):null;
        const size=kind==='emoji'?rand(23,isTiny?58:88):(kind==='spark'?rand(1.5,5):rand(3,17));
        particles.push({kind,emoji:e,x,y,vx:Math.cos(a)*v+rand(-30,30),vy:Math.sin(a)*v+rand(-30,30),
          size,spin:rand(-8,8),ang:rand(0,6.28),ttl:kind==='emoji'?rand(.9,1.85):rand(.35,1.2),
          life:0,color:choose(colors),spread,gravity:rand(55,220),drag:rand(.963,.987)});
      }
      // Hard cap prevents lag when the player spams extremely quickly.
      if(particles.length>1550) particles.splice(0,particles.length-1550);
      rings.push({x,y,r:7,max:Math.min(1300,260+combo*9),life:0,ttl:.55,color:combo>=35?'#fa52dc':'#ffb65f',width:rand(3,9)});
      if(superMode) rings.push({x:w/2,y:h/2,r:25,max:Math.max(w,h)*1.3,life:0,ttl:.9,color:'#ff2fb4',width:23});
      if(rings.length>55) rings.splice(0,rings.length-55);
    }
    function bigMoment(icon) {
      burstIcon.textContent=icon;burstIcon.classList.remove('pop');void burstIcon.offsetWidth;burstIcon.classList.add('pop');
      halo.style.borderColor=combo>=40?'#ff35c7':'#ffad4a';
      halo.animate([{opacity:1,transform:'translate(-50%, -50%) scale(.12)'},
        {opacity:.85,offset:.28},{opacity:0,transform:'translate(-50%, -50%) scale(8)'}],{duration:650,easing:'ease-out'});
      flashStrength=.68;glitchStrength=.7;shake=26;
      if(navigator.vibrate) navigator.vibrate([25,30,45]);
    }
    function playSound() {
      if(!audioEnabled) return;
      const now=performance.now();if(now-lastSound<68) return;lastSound=now;
      try {
        audio ||= new (window.AudioContext||window.webkitAudioContext)();
        if(audio.state==='suspended')audio.resume();
        const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
        o.type=combo>25?'sawtooth':'triangle';
        o.frequency.setValueAtTime(rand(130,220)+Math.min(combo,80)*6,t);
        o.frequency.exponentialRampToValueAtTime(rand(45,90),t+.12);
        g.gain.setValueAtTime(.038,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);
        o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.135);
      }catch(_){}
    }
    function explode(x,y) {
      const now=performance.now();
      const oldCombo=combo;
      combo=now-lastClick<470?Math.min(combo+1,120):1;
      lastClick=now;
      clicks++;
      scoreText.textContent=clicks.toLocaleString('tr-TR');
      // Save every few clicks to reduce storage overhead.
      if(clicks%5===0)try{localStorage.setItem('parmak-kaos-score',clicks)}catch(_){}
      const milestone=[12,25,45,70,100].find(v=>oldCombo<v&&combo>=v);
      emit(x,y,!!milestone);
      if(milestone)bigMoment(milestone>=70?'👑':milestone>=45?'💀':milestone>=25?'🌋':'🤯');
      shake=Math.min(22,shake+2.6+combo*.1);kick=Math.min(2.1,kick+.64);twist=rand(-10,10);
      flashStrength=Math.max(flashStrength,Math.min(.44,.095+combo*.005));
      glitchStrength=Math.max(glitchStrength,combo>25?.24:.0);
      setPips(combo);
      if(navigator.vibrate && combo<12 && clicks%3===0)navigator.vibrate(7);
      playSound();
    }
    world.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse' && e.button!==0)return;
      e.preventDefault();explode(e.clientX,e.clientY);
    });
    addEventListener('keydown',e=>{
      if((e.code==='Space'||e.code==='Enter')&&!e.repeat && !['BUTTON'].includes(document.activeElement.tagName)){
        e.preventDefault();explode(w/2,h/2);
      }
    });
    btnSound.addEventListener('pointerdown',e=>e.stopPropagation());
    btnReset.addEventListener('pointerdown',e=>e.stopPropagation());
    btnSound.addEventListener('click',()=>{
      audioEnabled=!audioEnabled;
      document.getElementById('speakerOff').style.display=audioEnabled?'none':'';
      document.getElementById('speakerOn').style.display=audioEnabled?'':'none';
      btnSound.setAttribute('aria-label',audioEnabled?'Sesi kapat':'Sesi aç');
      if(audioEnabled) {try {audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(_){}}
    });
    btnReset.addEventListener('click',()=>{
      clicks=0;combo=0;heat=0;lastClick=0;particles.length=0;rings.length=0;
      scoreText.textContent='0';setPips(0);
      try{localStorage.removeItem('parmak-kaos-score')}catch(_){}
      flashStrength=.13;
    });
    function drawSprite(p,alpha) {
      const s=sprites.get(p.emoji);if(!s)return;
      ctx.save();ctx.globalAlpha=alpha;ctx.translate(p.x,p.y);ctx.rotate(p.ang);
      ctx.drawImage(s,-p.size/2,-p.size/2,p.size,p.size);ctx.restore();
    }
    function frame(now) {
      const dt=Math.min((now-lastFrame)/1000,.04);lastFrame=now;
      const seconds=now/1000;
      ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
      // Sparse drifting sparks make the stage feel alive without automatic explosions.
      for(const s of stars){
        s.y-=s.v*dt;if(s.y<0){s.y=h;s.x=rand(0,w)}
        ctx.globalAlpha=s.a*(.7+.3*Math.sin(seconds*2+s.phase));ctx.fillStyle='#ffc6e7';
        ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
      for(let i=rings.length-1;i>=0;i--){
        const r=rings[i];r.life+=dt;const t=Math.min(1,r.life/r.ttl);if(t>=1){rings.splice(i,1);continue;}
        r.r=r.max*(1-Math.pow(1-t,3));ctx.strokeStyle=r.color;ctx.globalAlpha=(1-t)*.75;
        ctx.lineWidth=r.width*(1-t)+.8;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();
      }
      ctx.globalAlpha=1;
      for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];p.life+=dt;
        if(p.life>=p.ttl){particles.splice(i,1);continue;}
        const opacity=Math.min(1,(p.ttl-p.life)/Math.min(.4,p.ttl*.5));
        p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;p.ang+=p.spin*dt;
        const drag=Math.pow(p.drag,dt*60);p.vx*=drag;p.vy*=drag;
        if(p.kind==='emoji')drawSprite(p,opacity);
        else if(p.kind==='spark'){
          ctx.globalAlpha=opacity;ctx.strokeStyle=p.color;ctx.lineWidth=p.size;ctx.lineCap='round';
          ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.045,p.y-p.vy*.045);ctx.stroke();
        } else {
          ctx.save();ctx.globalAlpha=opacity;ctx.translate(p.x,p.y);ctx.rotate(p.ang);
          ctx.fillStyle=p.color;
          if(p.kind==='shard')ctx.fillRect(-p.size*.25,-p.size/2,p.size*.5,p.size);
          else {ctx.beginPath();ctx.arc(0,0,p.size*.32,0,Math.PI*2);ctx.fill();}
          ctx.restore();
        }
      }
      ctx.globalAlpha=1;
      // Smooth decay of camera recoil, light and combo indicators.
      const damp=Math.exp(-dt*11);shake*=Math.exp(-dt*13);kick*=damp;twist*=damp;
      const sx=shake?rand(-shake,shake):0,sy=shake?rand(-shake,shake):0;
      world.style.setProperty('--sx',sx.toFixed(2)+'px');world.style.setProperty('--sy',sy.toFixed(2)+'px');
      world.style.setProperty('--kick',kick.toFixed(3));hand.style.setProperty('--turn',twist.toFixed(2)+'deg');
      flashStrength*=Math.exp(-dt*13);flash.style.opacity=flashStrength.toFixed(3);
      glitchStrength*=Math.exp(-dt*4);glitch.style.opacity=(glitchStrength*.55).toFixed(3);
      if(combo && now-lastClick>670){combo=0;setPips(0);}
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    addEventListener('pagehide',()=>{try{localStorage.setItem('parmak-kaos-score',clicks)}catch(_){}});
    setPips(0);
  })();
  </script>
</body>
</html>
